name: CD

# ci/cd 브랜치에 push/머지될 때만 배포. 배포 검증 후 main에 머지하는 플로우.
on:
  push:
    branches: [ci/cd]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/cd' || github.event_name == 'workflow_dispatch'
    outputs:
      backend-jar: ${{ steps.backend-build.outputs.backend-jar }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build backend JAR
        id: backend-build
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: bootJar --no-daemon
          build-root-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://placeholder/postgres
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar

  deploy-backend:
    name: Deploy Backend (placeholder)
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production

    steps:
      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar

      # 예: EC2/VM에 배포, 또는 ECS/Cloud Run 등으로 배포
      # - name: Deploy to server
      #   run: |
      #     # scp / rsync / kubectl apply / gcloud run deploy 등
      #   env:
      #     DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      #     DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Placeholder (배포 스크립트 추가)
        run: echo "backend JAR 다운로드 완료. DEPLOY_HOST 등 시크릿 설정 후 배포 단계를 추가하세요."

  docker-push-frontend:
    name: Docker Build & Push (Frontend)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/cd' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./new-web-ui
          file: ./new-web-ui/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            cooolryan/contract-report-ui:latest
            cooolryan/contract-report-ui:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.example.com' }}

  deploy-frontend:
    name: Deploy Frontend (placeholder)
    runs-on: ubuntu-latest
    needs: docker-push-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/cd' || github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Placeholder (배포는 필요 시 추가)
        run: echo "이미지 푸시 완료. k8s 등 배포는 필요 시 워크플로에 단계 추가하세요."
