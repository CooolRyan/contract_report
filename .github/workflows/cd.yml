name: CD

# ci/cd 브랜치에 push/머지될 때만 배포. 배포 검증 후 main에 머지하는 플로우.
on:
  push:
    branches: [ci/cd]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/cd' || github.event_name == 'workflow_dispatch'
    outputs:
      backend-jar: ${{ steps.backend-build.outputs.backend-jar }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build backend JAR
        id: backend-build
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: bootJar --no-daemon
          build-root-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://placeholder/postgres
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar

  deploy-backend:
    name: Deploy Backend (placeholder)
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production

    steps:
      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar

      # 예: EC2/VM에 배포, 또는 ECS/Cloud Run 등으로 배포
      # - name: Deploy to server
      #   run: |
      #     # scp / rsync / kubectl apply / gcloud run deploy 등
      #   env:
      #     DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      #     DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Placeholder (배포 스크립트 추가)
        run: echo "backend JAR 다운로드 완료. DEPLOY_HOST 등 시크릿 설정 후 배포 단계를 추가하세요."

  docker-push-backend:
    name: Docker Build & Push (Backend)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/cd' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            cooolryan/contract-report-backend:latest
            cooolryan/contract-report-backend:sha-${{ github.sha }}

  docker-push-frontend:
    name: Docker Build & Push (Frontend)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/cd' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./new-web-ui
          file: ./new-web-ui/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            cooolryan/contract-report-ui:latest
            cooolryan/contract-report-ui:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.example.com' }}

  update-manifests-for-argocd:
    name: Update K8s manifests (ArgoCD sync)
    runs-on: ubuntu-latest
    needs: [docker-push-backend, docker-push-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/cd' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags to sha
        run: |
          SHA="${{ github.sha }}"
          sed -i "s|cooolryan/contract-report-backend:latest|cooolryan/contract-report-backend:sha-${SHA}|g" deploy/k8s-backend-deployment.yaml
          sed -i "s|cooolryan/contract-report-backend:sha-[a-f0-9]*|cooolryan/contract-report-backend:sha-${SHA}|g" deploy/k8s-backend-deployment.yaml
          sed -i "s|cooolryan/contract-report-ui:latest|cooolryan/contract-report-ui:sha-${SHA}|g" deploy/k8s-ui-deployment.yaml
          sed -i "s|cooolryan/contract-report-ui:sha-[a-f0-9]*|cooolryan/contract-report-ui:sha-${SHA}|g" deploy/k8s-ui-deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s-backend-deployment.yaml deploy/k8s-ui-deployment.yaml
          git diff --staged --quiet || git commit -m "chore(deploy): update image tags to sha-${GITHUB_SHA}"
          git push

  deploy-frontend:
    name: Deploy Frontend (placeholder)
    runs-on: ubuntu-latest
    needs: docker-push-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/cd' || github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Placeholder (배포는 필요 시 추가)
        run: echo "이미지 푸시 완료. ArgoCD가 deploy/ 매니페스트를 보고 있으면 update-manifests job에서 태그 갱신 후 자동 sync 됨."
