name: CD

# ci/cd 브랜치에 push/머지될 때만 배포. 배포 검증 후 main에 머지하는 플로우.
on:
  push:
    branches: [ci/cd]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/cd' || github.event_name == 'workflow_dispatch'
    outputs:
      backend-jar: ${{ steps.backend-build.outputs.backend-jar }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build backend JAR
        id: backend-build
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: bootJar --no-daemon
          build-root-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://placeholder/postgres
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar

  deploy-backend:
    name: Deploy Backend (placeholder)
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production

    steps:
      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar

      # 예: EC2/VM에 배포, 또는 ECS/Cloud Run 등으로 배포
      # - name: Deploy to server
      #   run: |
      #     # scp / rsync / kubectl apply / gcloud run deploy 등
      #   env:
      #     DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      #     DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Placeholder (배포 스크립트 추가)
        run: echo "backend JAR 다운로드 완료. DEPLOY_HOST 등 시크릿 설정 후 배포 단계를 추가하세요."

  deploy-frontend:
    name: Deploy Frontend (nginx)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/cd' || github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: new-web-ui/pnpm-lock.yaml

      - name: Build (static export for nginx)
        run: |
          cd new-web-ui && pnpm install --frozen-lockfile && pnpm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.example.com' }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: new-web-ui/out

      # nginx 서버에 배포: DEPLOY_WEB_HOST, DEPLOY_WEB_USER, DEPLOY_SSH_KEY 등 설정 후 주석 해제
      # - name: Deploy to nginx server
      #   run: |
      #     mkdir -p ~/.ssh && echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
      #     rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
      #       new-web-ui/out/ ${{ secrets.DEPLOY_WEB_USER }}@${{ secrets.DEPLOY_WEB_HOST }}:${{ vars.DEPLOY_WEB_PATH || '/var/www/performance-registry' }}/

      - name: Placeholder (nginx 서버 배포)
        run: echo "Frontend 정적 빌드(out/) 완료. DEPLOY_WEB_HOST 등 시크릿 설정 후 rsync/scp 단계를 추가하세요."
