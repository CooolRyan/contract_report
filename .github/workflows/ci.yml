name: CI

on:
  push:
    branches: [main, dev, ci/cd]
  pull_request:
    branches: [main, dev, ci/cd]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: performance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build and test
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: build -x bootJar --no-daemon
          build-root-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/performance_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: new-web-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: new-web-ui

      - name: Lint
        run: pnpm run lint
        working-directory: new-web-ui

      - name: Build
        run: pnpm run build
        working-directory: new-web-ui
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com

  kiwoom-agent:
    name: Kiwoom Agent (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: kiwoom-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: kiwoom-agent

      - name: Check syntax
        run: python -m py_compile fetch_trades.py
        working-directory: kiwoom-agent

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_DISABLE_NIGHTLY_WARNING: 1

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install forge-std
        run: |
          mkdir -p contracts/lib
          git clone --depth 1 https://github.com/foundry-rs/forge-std.git contracts/lib/forge-std

      - name: Build
        run: forge build
        working-directory: contracts

      - name: Test
        run: forge test
        working-directory: contracts
