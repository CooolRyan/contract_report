server:
  port: 8080

blockchain:
  rpc-url: https://rpc.sepolia.org
  contract-address: ""
  private-key: ""

# 키움 REST API (환경변수 KIWOOM_APPKEY, KIWOOM_SECRETKEY 권장)
kiwoom:
  appkey: ${KIWOOM_APPKEY:}
  secretkey: ${KIWOOM_SECRETKEY:}
  base-url: https://api.kiwoom.com

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/performance
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
