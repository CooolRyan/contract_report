# Docker Hub에 push한 프론트 이미지를 k8s에서 바로 사용하는 예시
# 이미지: cooolryan/contract-report-ui:latest (public이면 pull 별도 로그인 불필요)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract-report-ui
  namespace: contract
  labels:
    app: contract-report-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contract-report-ui
  template:
    metadata:
      labels:
        app: contract-report-ui
    spec:
      containers:
        - name: nginx
          image: cooolryan/contract-report-ui:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: contract-report-ui
  namespace: contract
spec:
  selector:
    app: contract-report-ui
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
